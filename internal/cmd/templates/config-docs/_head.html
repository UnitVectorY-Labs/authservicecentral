{{define "head"}}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a2a">
  <title>{{.PageTitle}} · Authorization guide</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172321; --muted: #5d6b68; --line: #d9e1df; --soft: #f3f7f5;
      --paper: #fff; --brand: #0d665b; --brand-dark: #102a2a; --accent: #dff3ed; --warning: #fff7df;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink); background: var(--soft); line-height: 1.55;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; }
    a { color: var(--brand); text-underline-offset: .18em; }
    a:hover { text-decoration-thickness: 2px; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
    .site-header { background: var(--brand-dark); color: white; }
    .header-inner { max-width: 1180px; margin: 0 auto; padding: 1rem 1.25rem .8rem; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; }
    .brand { color: white; text-decoration: none; }
    .brand-mark { display: block; font-weight: 800; letter-spacing: -.02em; }
    .brand-subtitle { display: block; color: #bcd1cd; font-size: .82rem; }
    .site-nav { display: flex; gap: .35rem; margin-top: .9rem; }
    .site-nav a { color: #dce8e5; text-decoration: none; padding: .48rem .68rem; border-radius: .45rem; font-size: .92rem; white-space: nowrap; }
    .site-nav a:hover { background: #284744; }
    .site-nav a[aria-current="page"] { background: white; color: var(--brand-dark); font-weight: 700; }
    .search { position: relative; width: min(24rem, 42vw); }
    .search label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .search input { width: 100%; border: 1px solid #58716d; border-radius: .55rem; padding: .65rem .8rem .65rem 2.25rem; background: #f8fbfa; color: var(--ink); font: inherit; }
    .search-icon { position: absolute; left: .8rem; top: .66rem; color: var(--muted); pointer-events: none; }
    .search-results { position: absolute; z-index: 20; top: calc(100% + .4rem); right: 0; width: min(32rem, 88vw); max-height: 26rem; overflow-y: auto; margin: 0; padding: .4rem; list-style: none; border: 1px solid var(--line); border-radius: .6rem; background: white; box-shadow: 0 14px 35px rgba(7, 30, 27, .2); color: var(--ink); }
    .search-results:empty, .search-results[hidden] { display: none; }
    .search-results a { display: block; padding: .65rem .7rem; border-radius: .4rem; color: var(--ink); text-decoration: none; }
    .search-results a:hover, .search-results a:focus { background: var(--accent); outline: none; }
    .result-type { display: block; color: var(--brand); font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .result-name { display: block; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-weight: 700; overflow-wrap: anywhere; }
    .result-summary { display: block; color: var(--muted); font-size: .84rem; }
    .mobile-nav { display: none; }
    main { max-width: 1020px; margin: 0 auto; padding: 2.6rem 1.25rem 5rem; }
    .eyebrow { margin: 0 0 .35rem; color: var(--brand); font-size: .76rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 18ch; font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.05; letter-spacing: -.04em; }
    h2 { margin: 0 0 .55rem; font-size: 1.35rem; line-height: 1.2; letter-spacing: -.015em; }
    h3 { margin: 1.3rem 0 .45rem; font-size: 1rem; }
    .lede { max-width: 70ch; margin: .9rem 0 0; color: var(--muted); font-size: 1.08rem; }
    .page-header { margin-bottom: 2rem; }
    .breadcrumb { margin: 0 0 1rem; color: var(--muted); font-size: .9rem; }
    .breadcrumb a { color: inherit; }
    .panel, .item-card, .question-card { background: var(--paper); border: 1px solid var(--line); border-radius: .75rem; }
    .panel { margin: 1.25rem 0; padding: 1.35rem; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin: 1.5rem 0; }
    .question-card { padding: 1.25rem; }
    .question-card p:last-child { margin-bottom: 0; }
    .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; padding: 1px; background: var(--line); border: 1px solid var(--line); border-radius: .75rem; overflow: hidden; }
    .step { background: white; padding: 1.25rem; }
    .step-number { display: inline-grid; place-items: center; width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--accent); color: var(--brand); font-weight: 800; }
    .step h2 { margin-top: .65rem; font-size: 1.05rem; }
    .step p { margin-bottom: 0; color: var(--muted); font-size: .92rem; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .75rem; margin: 1.5rem 0; }
    .stat { padding: 1rem; background: white; border: 1px solid var(--line); border-radius: .65rem; color: var(--muted); }
    .stat strong { display: block; color: var(--ink); font-size: 1.7rem; line-height: 1; }
    .item-list { display: grid; gap: .75rem; margin: 1.25rem 0; }
    .item-card { display: grid; grid-template-columns: minmax(12rem, 1fr) 2fr auto; align-items: center; gap: 1rem; padding: 1rem 1.1rem; text-decoration: none; color: var(--ink); }
    .item-card:hover { border-color: #9bbcb5; box-shadow: 0 3px 12px rgba(13, 102, 91, .08); }
    .item-card code { font-weight: 750; color: var(--brand-dark); }
    .item-meta { color: var(--muted); font-size: .9rem; }
    .arrow { color: var(--brand); font-size: 1.2rem; }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .6rem 0; padding: 0; list-style: none; }
    .chip { display: inline-flex; border-radius: 999px; padding: .3rem .6rem; background: var(--accent); color: #164f47; font-size: .83rem; text-decoration: none; }
    .chip:hover { background: #c8e8df; }
    .chip-neutral { background: #edf1f0; color: #43504e; }
    .definition-grid { display: grid; grid-template-columns: minmax(10rem, 1fr) 2fr; gap: .75rem 1.25rem; margin: 0; }
    .definition-grid dt { font-weight: 700; }
    .definition-grid dd { margin: 0; min-width: 0; }
    .callout { padding: 1rem 1.15rem; border-left: .3rem solid #d69b19; border-radius: .3rem; background: var(--warning); }
    .callout p { margin: 0; }
    .muted, .empty { color: var(--muted); }
    .data-table { overflow-x: auto; margin: .75rem 0; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: .7rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
    .method { display: inline-block; min-width: 3.5rem; color: var(--brand); font-weight: 800; }
    .section-heading { margin-top: 2rem; }
    .section-heading p { margin: .35rem 0 0; color: var(--muted); }
    .anchor-section { scroll-margin-top: 1rem; }
    footer { max-width: 1020px; margin: 0 auto; padding: 0 1.25rem 2rem; color: var(--muted); font-size: .82rem; }
    @media (max-width: 760px) {
      .header-inner { padding: .85rem 1rem; }
      .topline { align-items: flex-start; gap: .75rem; }
      .brand-subtitle { display: none; }
      .search { width: min(14rem, 56vw); }
      .search input { padding-top: .55rem; padding-bottom: .55rem; }
      .search-icon { top: .56rem; }
      .site-nav { display: none; }
      .mobile-nav { display: block; margin-top: .7rem; }
      .mobile-nav summary { cursor: pointer; width: fit-content; padding: .35rem 0; color: #dce8e5; font-weight: 700; }
      .mobile-nav nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .35rem; padding: .45rem 0 .2rem; }
      .mobile-nav a { padding: .55rem; border: 1px solid #3d5b57; border-radius: .4rem; color: white; text-decoration: none; }
      main { padding: 2rem 1rem 4rem; }
      .page-header { margin-bottom: 1.5rem; }
      .grid, .steps { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .item-card { grid-template-columns: 1fr auto; gap: .35rem .75rem; }
      .item-meta { grid-column: 1 / -1; }
      .definition-grid { grid-template-columns: 1fr; gap: .2rem; }
      .definition-grid dd { margin-bottom: .75rem; }
      .panel { padding: 1rem; }
    }
    @media (max-width: 380px) {
      .brand-mark { font-size: .9rem; }
      .search { width: 55vw; }
      .search input::placeholder { color: transparent; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
{{end}}
